  box.append(h('button', { class: 'n-more', onclick: x.edit }, 'Modifier ou supprimer ce crédit'));
  return box;
}

/* ---------- MES COÛTS ---------- */
function vCosts() {
  const K = keyFigures(), B = K.B, L = leakData();
  const box = h('div', { class: 'n-view', style: '--cc: var(--ch2); --cl: var(--ch2-l);' }, nHead('Combien ça me coûte, combien il me reste ?', 'Mes coûts'));

  // 1. Le budget du mois
  box.append(nWh('Votre mois'));
  if (!(B.rev > 0)) {
    box.append(nTight(nRow({ t: 'Combien gagnez-vous par mois ?', s: 'Vos revenus nets : c’est le point de départ pour calculer votre épargne possible.', onclick: () => openRevenueEditModal(B), vs: h('span', { class: 'n-pill' }, 'Renseigner') })));
  } else {
    const gs = Object.entries(B.groups).map(([gk, g]) => ({ gk, g, v: totalGroupSpend(g) })).sort((x, y) => y.v - x.v);
    const cap = K.cap;
    box.append(nCard(
      nKick(cap >= 0 ? 'Il vous reste chaque mois' : 'Il vous manque chaque mois', cap >= 0 ? 'var(--up)' : 'var(--down)'),
      h('div', { class: 'n-big num', style: cap < 0 ? 'color: var(--down);' : null }, nE(Math.abs(cap))),
      nSub(cap >= 0 ? 'C’est votre épargne possible : ce que vous pouvez placer ou garder pour vos projets.' : 'Vos dépenses dépassent vos revenus : regardez les plus gros postes.'),
      h('div', { class: 'n-buds' },
        h('button', { class: 'n-bud n-bud-rev', onclick: () => openRevenueEditModal(B) }, h('div', { class: 'n-bud-h' }, h('span', null, 'Revenus'), h('b', { class: 'num n-pos' }, '+ ' + nE(B.rev)))),
        ...gs.map(({ gk, g, v }) => h('button', { class: 'n-bud', onclick: () => go('#/n/c/' + gk) },
          h('div', { class: 'n-bud-h' }, h('span', null, g.name, v ? h('em', null, `${P0.format(v / B.rev)} des revenus`) : h('em', null, 'à renseigner')), h('b', { class: 'num' }, v ? '− ' + nE(v) : '—')),
          v ? h('div', { class: 'n-bar', style: 'margin-top: 6px;' }, h('i', { style: `width: ${Math.min(100, v / B.rev * 100).toFixed(1)}%; background: var(--ch2);` })) : null)),
        K.prov > 0 ? h('button', { class: 'n-bud', onclick: () => go('#/s') }, h('div', { class: 'n-bud-h' }, h('span', null, 'Mises de côté prévues', h('em', null, 'dans Mon plan')), h('b', { class: 'num' }, '− ' + nE(K.prov)))) : null),
      h('button', { class: 'n-more', onclick: () => openGroupModal(B) }, 'Ajouter une catégorie')));

    // 2. Les grosses dépenses de l'année
    const bills = (B.annualBills || []).slice().sort((x, y) => (x.dueMonth || 0) - (y.dueMonth || 0));
    const bt = bills.reduce((t, x) => t + x.amt, 0);
    box.append(nWh('Les grosses dépenses de l’année', null, bt ? nE(bt) : null));
    box.append(nTight(...bills.map(x => nRow({ t: x.name, s: `en ${MONTHS_L[x.dueMonth || 0]}`, v: nE(x.amt), onclick: () => billModal(B, x) })),
      bills.length ? nSub(`Soit ≈ ${nE(bt / 12)} par mois à mettre de côté pour ne pas être pris de court.`) : null,
      h('button', { class: 'n-more', onclick: () => billModal(B) }, bills.length ? 'Ajouter une dépense' : 'Taxe foncière, assurance, impôts… Ajoutez-les')));
  }

  // 3. Ce que coûte votre patrimoine sur 20 ans
  const rows = [];
  S.envs.map(e => ({ e, f: fees(e) })).filter(x => x.f > 0.5).sort((x, y) => y.f - x.f)
    .forEach(({ e, f }) => rows.push({ ico: '%', t: `Frais · ${e.name}`, s: `${nE(f)} par an`, v: f * (Math.pow(1.04, 20) - 1) / 0.04, fn: () => go('#/e/' + e.id) }));
  L.items.filter(x => x.ico !== '%').forEach(x => rows.push(Object.assign({}, x, { fn: x.ico === '⌂' || x.ico === '§' ? () => go('#/a') : null })));
  if (rows.length) {
    const tot = rows.reduce((t, x) => t + x.v, 0);
    box.append(nWh('Ce que coûte votre patrimoine', 'var(--down)'));
    box.append(nTight(h('div', { class: 'n-sub', style: 'padding: 12px 0 4px;' }, 'Sur 20 ans, au total : ', h('b', { style: 'color: var(--down);' }, '− ' + kE(tot))),...rows.sort((x, y) => y.v - x.v).map(x => nRow({ lead: h('span', { class: 'n-d' }, x.ico), t: x.t, s: x.s, tip: x.tip, v: '− ' + kE(x.v), vc: 'var(--down)', onclick: x.fn || null }))),
      nNote('Cumul sur 20 ans, avec l’hypothèse d’un placement à 4 % par an. Repères pédagogiques, pas des conseils en investissement.'));
  }
  return box;
}

// Ajouter, modifier ou supprimer une grosse dépense de l'année
function billModal(B, bill) {
  const root = $('#modal-root'), close = () => { root.innerHTML = ''; };
  const nameIn = h('input', { type: 'text', placeholder: 'ex. Taxe foncière', value: bill ? bill.name : '' });
  const amtIn = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex. 1200', value: bill ? String(bill.amt).replace('.', ',') : '' });
  const monthSel = h('select', null, ...MONTHS_L.map((m, i) => h('option', { value: i, selected: bill && (bill.dueMonth || 0) === i ? true : null }, m)));
  const modal = h('div', { class: 'modal-overlay', onclick: ev => { if (ev.target === modal) close(); } },
    h('div', { class: 'modal-sheet', style: 'max-width: 460px;' },
      h('div', { class: 'modal-header' }, h('div', { class: 'modal-title' }, bill ? 'Modifier la dépense' : 'Nouvelle grosse dépense'), h('button', { class: 'btn-icon-only', onclick: close }, getIcon('x', 16))),
      h('div', { class: 'modal-body form-grid' },
        h('div', { class: 'form-group full-col' }, h('label', { class: 'form-label' }, 'Nom'), nameIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Montant sur l’année (€)'), amtIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Mois'), monthSel),
        bill ? h('div', { class: 'full-col' }, h('button', { class: 'btn btn-danger btn-full', onclick: () => { B.annualBills = B.annualBills.filter(x => x !== bill); save(); close(); toast('Dépense supprimée'); render(); } }, getIcon('trash', 15), 'Supprimer cette dépense')) : null),
      h('div', { class: 'modal-footer' }, h('button', { class: 'btn btn-secondary', onclick: close }, 'Annuler'),
        h('button', { class: 'btn btn-primary', onclick: () => {
          const nm = nameIn.value.trim(), a = pf(amtIn.value);
          if (!nm) { nameIn.focus(); return; } if (!(a > 0)) { amtIn.focus(); return; }
          if (bill) Object.assign(bill, { name: nm, amt: a, dueMonth: +monthSel.value });
          else (B.annualBills = B.annualBills || []).push({ id: uid(), name: nm, amt: a, dueMonth: +monthSel.value });
          save(); close(); render();
        } }, 'Enregistrer'))));
  root.replaceChildren(modal);
  setTimeout(() => nameIn.focus(), 50);
}

/* ---------- PAGE D'UNE CATÉGORIE DE DÉPENSES ---------- */
function vBudgetGroup(gk) {
  const B = getBudget(), g = B.groups[gk];
  if (!g) { setTimeout(() => go('#/n')); return h('div'); }
  const box = h('div', { class: 'n-view', style: '--cc: var(--ch2); --cl: var(--ch2-l);' }, nBack('#/n', 'Mes coûts'), nHead('Dépenses du mois', g.name));
  const totB = h('div', { class: 'n-big num' }, nE(totalGroupSpend(g)));
  const refresh = () => { totB.textContent = nE(totalGroupSpend(g)); };
  box.append(nCard(nKick('Total par mois'), totB, nSub('Touchez un montant pour le modifier. Il est enregistré aussitôt.')));
  box.append(nWh('Postes', null, `${g.items.length}`));
  box.append(nTight(...g.items.map(it => {
      const inp = h('input', { class: 'n-amt num', type: 'text', inputmode: 'decimal', value: it.amt ? String(it.amt).replace('.', ',') : '', placeholder: '0', 'aria-label': 'Montant de ' + it.name });
      inp.onchange = () => {
        const raw = inp.value.replace(/[\s\u00a0\u202f€]/g, '');
        if (raw === '') it.amt = 0;
        else if (!/^\d+([.,]\d{1,2})?$/.test(raw)) { inp.value = it.amt ? String(it.amt).replace('.', ',') : ''; toast('Montant non valide : chiffres uniquement, ex. 1 250 ou 39,90'); return; }
        else it.amt = parseFloat(raw.replace(',', '.'));
        save(); refresh();
      };
      const del = h('button', { class: 'btn-icon-only', 'aria-label': 'Supprimer ' + it.name, onclick: () => { g.items = g.items.filter(x => x !== it); save(); render(); } }, getIcon('x', 15));
      return h('div', { class: 'n-row' }, h('div', { class: 'n-tt' }, h('b', null, it.name)), h('label', { class: 'n-amt-w' }, inp, h('span', null, '€')), del);
    }),
    h('button', { class: 'n-more', onclick: () => openAddBudgetItemModal(g) }, 'Ajouter un poste')));
  box.append(nTight(nRow({ t: 'Renommer ou supprimer la catégorie', onclick: () => openGroupModal(B, gk) })));
  return box;
}

/* ---------- MES PROJETS ---------- */
function vProjects() {
  const K = keyFigures(), X = goalCalc(), G = gl().slice().sort((a, b) => a.date.localeCompare(b.date));
  const box = h('div', { class: 'n-view', style: '--cc: var(--ch3); --cl: var(--ch3-l);' }, nHead('Pour quoi j’épargne ?', 'Mes projets'));
  if (!G.length) {
    box.append(h('div', { class: 'n-callout' }, h('div', { style: 'font-size: 15px;' }, 'Un voyage, une voiture, un apport ? Ajoutez un projet : snowball calcule ce qu’il faut mettre de côté chaque mois.')),
      h('button', { class: 'n-detail-btn', onclick: () => openGoalModal() }, 'Ajouter un projet'));
    return box;
  }
  const eff = G.map(g => ({ g, x: X[g.id] || { funded: 0, parts: [] }, e: goalEffort(g, X[g.id]) }));
  const next = eff.find(z => !isGoalDone(z.g, z.x));
  if (next) box.append(h('div', { class: 'n-callout' }, nKick(`Prochain objectif · ${next.g.name}, ${fmtGoalDate(next.e.gd)}`),
    h('div', { style: 'margin-top: 4px; font-size: 15px;' }, next.e.effort > 0 ? h('span', null, 'Mettez ', h('b', null, `≈ ${nE(next.e.effort)} par mois`), ` pendant ${next.e.n} mois pour l’atteindre à temps.`) : 'Il est déjà couvert par vos placements et achats prévus.')));
  box.append(nTight(...eff.map(({ g, x, e }) => { const p = g.target > 0 ? Math.min(1, x.funded / g.target) : 0, done = isGoalDone(g, x);
    return h('button', { class: 'n-goal', onclick: () => go('#/g/' + g.id) },
      h('div', { class: 'n-gh' }, h('b', null, g.name), h('em', { style: done ? 'color: var(--up);' : null }, done ? 'Atteint ✓' : P0.format(p))),
      h('div', { class: 'n-bar' }, h('i', { style: `width: ${(p * 100).toFixed(1)}%;${done ? ' background: var(--up);' : ''}` })),
      h('div', { class: 'n-gf' }, h('span', null, `${nE(x.funded)} sur ${nE(g.target)}`), h('span', null, `${e.effort > 0 ? nE(e.effort) + ' / mois · ' : ''}${fmtGoalDate(e.gd)}`))); })));
  const tot = eff.reduce((t, z) => t + z.e.effort, 0);
  if (B_ok()) box.append(h('div', { class: 'n-callout', style: `--cl: ${tot <= K.cap ? 'var(--up-light)' : 'var(--warn-light)'};` },
    'Vos projets demandent ', h('b', null, `${nE(tot)} / mois`), ` sur ${nE(Math.max(0, K.cap))} possibles : `, tot <= K.cap ? h('span', null, 'il vous reste ', h('b', null, nE(K.cap - tot)), ' de marge.') : h('span', null, 'il manque ', h('b', null, nE(tot - K.cap)), ' par mois.')));
  box.append(nMore(sheetGoals), h('button', { class: 'n-more', onclick: () => openGoalModal() }, 'Ajouter un projet'));
  box.append(nWh('Tout le détail'), nDetail('Tous les projets', 'financement par compte, brut ou net d’impôts, indépendance financière', '#/g/d'));
  return box;
}
const B_ok = () => getBudget().rev > 0;

/* ---------- MON PLAN ---------- */
function vPlan() {
  const K = keyFigures(), Y = nowYear(), M = nowMonth(), T = getStrategy(Y), B = K.B;
  const box = h('div', { class: 'n-view', style: '--cc: var(--ch4); --cl: var(--ch4-l);' }, nHead('Comment j’y arrive ?', 'Mon plan'));
  box.append(nWh(`Votre année ${Y}`, null, 'Détail', () => go('#/s/d')));
  const months = MONTHS_S.map((_, m) => {
    const buys = T.b.filter(b => b.m === m), provs = T.p.filter(p => m >= (p.f || 0));
    const bills = (B.annualBills || []).filter(b => (b.dueMonth || 0) === m).reduce((t, b) => t + b.amt, 0);
    const done = buys.filter(b => b.done).reduce((t, b) => t + b.amt, 0) + provs.filter(p => (T.pd[m] || []).includes(p.id)).reduce((t, p) => t + p.amt, 0);
    const all = buys.reduce((t, b) => t + b.amt, 0) + provs.reduce((t, p) => t + p.amt, 0);
    return { done, todo: all - done, bills };
  });
  const cap = Math.max(0, K.cap), mx = Math.max(1, cap, ...months.map(x => x.done + x.todo + x.bills)) * 1.15, Hc = 110;
  const cal = h('div', { class: 'n-cal' });
  if (cap > 0) cal.append(h('div', { class: 'n-cap', style: `bottom: ${(cap / mx * Hc + 18).toFixed(0)}px;` }, h('em', null, `capacité ${kE(cap)}`)));
  months.forEach((x, m) => {
    const tot = x.done + x.todo + x.bills;
    cal.append(h('button', { class: m < M ? 'past' : m === M ? 'now' : '', 'aria-label': 'Détail de ' + MONTHS_L[m], onclick: () => openMonthDetailsModal(Y, m) },
      h('div', { class: 'b', style: `height: ${(tot / mx * 100).toFixed(1)}%;` },
        x.bills > 0 ? h('i', { style: `flex: ${x.bills}; background: var(--ch2);` }) : null,
        x.todo > 0 ? h('i', { style: `flex: ${x.todo}; background: ${m <= M ? 'var(--ch4-l); border: 1.5px dashed var(--ch4)' : 'var(--ch4)'};` }) : null,
        x.done > 0 ? h('i', { style: `flex: ${x.done}; background: var(--ch4);` }) : null),
      h('span', null, MONTHS_S[m])));
  });
  box.append(nCard(cal, nSub('Vert = achats et mises de côté · orange = grosse dépense de l’année · pointillé = à valider')));
  if (!T.b.length && !T.p.length) box.append(nTight(nRow({ t: 'Programmez votre épargne', s: 'Un achat ou une mise de côté chaque mois : snowball vous le rappelle.', onclick: () => go('#/s/d'), vs: h('span', { class: 'n-pill' }, 'Commencer') })));
  const P = passiveData();
  if (P.tot > 0) {
    box.append(nWh('Ce que votre boule vous rapporte', 'var(--up)', '12 mois'));
    box.append(h('div', { class: 'n-card n-passive' }, h('div', { class: 'n-big num' }, `${sE(P.tot)} / an`), nSub(`soit ≈ ${nE(P.tot / 12)} par mois, sans rien faire`),
      svgEl(passiveBarsH(P)),
      P.div > 0 ? nRow({ t: 'Dividendes reçus', s: 'réels, 12 derniers mois', v: sE(P.div), vc: 'var(--up)' }) : null,
      P.interest > 0 ? nRow({ t: 'Intérêts estimés', s: 'livrets, fonds euros', v: sE(P.interest), vc: 'var(--up)' }) : null,
      nMore(sheetPassive)));
  }
  const dc = divCalCard(); if (dc) box.append(dc);
  box.append(nWh('Tout le détail'), nDetail('Plan complet', 'achats programmés, mises de côté, calendrier, années suivantes', '#/s/d'));
  return box;
}

function vTarget() {
  const box = h('div', { class: 'n-view' }, nBack('#/a', 'Mon argent'), nHead('Vers où aller ?', 'Répartition visée'));
  const tc = targetCard(); if (tc) box.append(tc); else box.append(nNote('Ajoutez d’abord un compte ou un placement.'));
  return box;
}

const withTop = (top, view) => { const d = h('div', null); if (top) d.append(top); d.append(view); return d; };

function render() {
  if (WZ_OPEN) return; // le parcours d'accueil couvre l'écran : la vue sera rendue à sa fermeture
  const r = (location.hash || '#/').slice(2).split('/');
  let k = r[0] || '';

  const views = {
    '': vToday,
    'a': () => r[1] === 't' ? vTarget() : vMoney(),
    'k': () => vCredit(r.slice(1).join('/')),
    'b': vBall,
    'h': vHealth,
    'c': () => vClass(r[1]),
    'e': () => vAccount(r[1]),
    'l': () => vLine(r[1], r[2]),
    'n': () => r[1] === 'c' ? vBudgetGroup(r[2]) : vCosts(),
    's': () => r[1] === 'd' ? withTop(nBack('#/s', 'Mon plan'), vStrat()) : vPlan(),
    'g': () => r[1] === 'd' ? withTop(nBack('#/g', 'Mes projets'), vGoalsR()) : r[1] ? vGoalsR(r[1]) : vProjects(),
    'u': vCosts
  };

  const currentView = views[k] || vHome;
  try {
    $('#app').replaceChildren(currentView());
    addHints($('#app'));
  } catch(err) {
    console.error(err);
    $('#app').replaceChildren(
      h('div', { class: 'card', style: 'padding: 24px; text-align: center;' },
        h('div', { style: 'font-weight: 700; color: var(--down);' }, 'Erreur d’affichage'),
        h('p', { style: 'font-size: 13px; color: var(--muted); margin: 6px 0 16px;' }, String(err && err.message || err)),
        h('button', { class: 'btn btn-primary btn-sm', onclick: () => go('#/') }, 'Retour à l’accueil')
      )
    );
  }

  updateNav(k);
  updateRelayStatusBadge();
}

function updateNav(k) {
  const activeIdx = ['', 'b'].includes(k) ? 0 : ['n', 'u'].includes(k) ? 2 : k === 'g' ? 3 : k === 's' ? 4 : 1;
  
  const pendingBuysCount = (S.st && S.st[nowYear()] ? S.st[nowYear()].b.filter(b => isDueBuy(b, nowYear())).length : 0) + pendProv(nowYear()).length;

  const items = [
    { label: 'Accueil', icon: 'home', href: '#/', badge: pendingBuysCount, cc: 'var(--ink)' },
    { label: 'Mon argent', icon: 'wallet', href: '#/a', cc: 'var(--ch1)' },
    { label: 'Mes coûts', icon: 'percent', href: '#/n', cc: 'var(--ch2)' },
    { label: 'Mes projets', icon: 'target', href: '#/g', cc: 'var(--ch3)' },
    { label: 'Mon plan', icon: 'trending-up', href: '#/s', cc: 'var(--ch4)' }
  ];

  $('#nav-container').replaceChildren(
    ...items.map((item, idx) => {
      const link = h('a', {
        href: item.href,
        class: 'nav-link',
        style: `--cc: ${item.cc};`,
        'aria-current': idx === activeIdx ? 'page' : null
      },
        getIcon(item.icon, 20),
        h('span', null, item.label)
      );
      if (item.badge > 0) {
        link.append(h('span', { class: 'nav-badge' }, String(item.badge)));
      }
      return link;
    })
  );
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

// Démarrage initial
window.addEventListener('load', () => {
  render();
  if (S.wz && S.wz.open) openWizard();
  if (S.url) refreshQuotes();
  if (relayIsDefault() && !(S.relayV >= RELAY_VERSION)) relayPingSilent();
});

setInterval(() => {
  if (S.url && !document.hidden) refreshQuotes();
}, 5 * 60 * 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.url && (!M.t || Date.now() - M.t > 5 * 60 * 1000)) {
    refreshQuotes();
  }
});
</script>
