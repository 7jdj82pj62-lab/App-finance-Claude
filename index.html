    const total = () => (G.queue || []).length;
    const curType = () => (G.queue || [])[G.qi || 0];
    const tag = () => `${total() > 1 ? `Projet ${(G.qi || 0) + 1} sur ${total()} · ` : ''}${(D.name || '').trim() || D.type}`;
    const nextGoal = () => {
      if ((G.qi || 0) < total() - 1) { G.qi++; const prev = (G.done || [])[G.qi]; G.d = prev ? { ...prev, envs: prev.envs.slice() } : def(); if (!prev) { G.d.type = curType(); G.d.name = curType() === 'Autre' ? '' : curType(); } G.stage = curType() === 'Autre' && !prev ? 'gname' : 'gamt'; wzDraw(true); }
      else { G.queue = []; G.qi = 0; G.d = null; G.done = []; stage('list'); }
    };
    if (G.stage === 'type') {
      G.sel = G.sel || [];
      return {
        title: 'Quels projets vous tiennent à cœur ?', lead: 'Cochez tout ce qui vous concerne.',
        body: [wzChoices(GOAL_TYPES.map(t => ({ ic: WZ_GOAL_IC[t] || 'star', t, col: 'ch3', on: G.sel.includes(t), fn: () => { G.sel = G.sel.includes(t) ? G.sel.filter(z => z !== t) : [...G.sel, t]; wzDraw(false); } })), 2, 'compact')],
        onBack: gl().length ? () => stage('list') : null,
        skip: gl().length || G.sel.length ? null : 'Pas de projet pour l’instant',
        next: G.sel.length ? { label: `Continuer · ${G.sel.length}`, fn: () => { G.queue = G.sel.slice(); G.sel = []; G.qi = 0; G.done = []; G.d = def(); G.d.type = G.queue[0]; G.d.name = G.queue[0] === 'Autre' ? '' : G.queue[0]; stage(G.queue[0] === 'Autre' ? 'gname' : 'gamt'); } }
          : gl().length ? { label: 'Voir mes projets', fn: () => stage('list') } : { label: 'Cochez au moins un projet', disabled: true }
      };
    }
    if (G.stage === 'gname') {
      const inp = h('input', { type: 'text', class: 'af-q', value: D.name, placeholder: 'ex. Tour du monde', oninput: () => { D.name = inp.value; } });
      return { kicker: tag(), title: 'Quel est ce projet ?', body: [inp], onBack: () => stage('type'),
        next: { label: 'Continuer', fn: () => { if (!(D.name || '').trim()) { inp.focus(); return; } stage('gamt'); } }, after: () => inp.focus() };
    }
    if (G.stage === 'gamt') {
      const err = h('div', { class: 'wz-err', role: 'alert' });
      return {
        kicker: tag(), title: `${(D.name || '').trim() || D.type} : combien faut-il ?`,
        body: [wzAmount(D.target, n => { D.target = n; }, { label: 'Montant du projet en euros' }), err],
        onBack: () => { if (D.type === 'Autre') { stage('gname'); return; } if ((G.qi || 0) > 0) { G.qi--; const prev = G.done[G.qi]; G.d = { ...prev, envs: prev.envs.slice() }; stage('envs'); return; } stage('type'); },
        next: { label: 'Continuer', fn: () => { if (!(D.target > 0)) { err.textContent = 'Indiquez le montant de votre projet.'; return; } stage('gwhen'); } }
      };
    }
    if (G.stage === 'gwhen') {
      const dtIn = h('input', { type: 'date', value: D.date || '', oninput: () => { D.date = dtIn.value || null; D.yrs = null; } });
      return {
        kicker: tag(), title: `${(D.name || '').trim() || D.type} : pour quand ?`,
        body: [wzChips([[1, '1 an'], [2, '2 ans'], [3, '3 ans'], [5, '5 ans'], [10, '10 ans'], [20, '20 ans']].map(([y, t]) => [t, !D.date && D.yrs === y, () => { D.yrs = y; D.date = null; wzDraw(false); }])),
          wzMore('Date précise', wzField('Date', dtIn))],
        onBack: () => stage('gamt'),
        next: { label: 'Continuer', fn: () => stage('envs') }
      };
    }
    if (G.stage === 'envs') {
      const dateOf = () => D.date || new Date(nowYear() + (D.yrs || 2), nowMonth(), 1).toISOString().slice(0, 10);
      const add = () => {
        const nm = (D.name || '').trim() || D.type;
        const ex = D.gid && gl().find(z => z.id === D.gid);
        if (ex) Object.assign(ex, { name: nm, type: D.type, target: D.target, date: dateOf(), envs: D.envs.slice() });
        else { D.gid = uid(); gl().push({ id: D.gid, name: nm, type: D.type, target: D.target, date: dateOf(), envs: D.envs.slice() }); }
        (G.done = G.done || [])[G.qi || 0] = { ...D, envs: D.envs.slice() };
        wzSave(); nextGoal();
      };
      return {
        kicker: `${tag()} · ${E0.format(D.target || 0)}`,
        title: `${(D.name || '').trim() || D.type} : avec quelle épargne le financer ?`,
        lead: 'Cochez les comptes dont l’argent servira à ce projet.',
        body: [wzChoices(S.envs.map(e => ({ ic: TYPES[e.type].icon || 'box', t: e.name, d: E0.format(agg(e.lines).v), col: 'ch3', on: D.envs.includes(e.id),
          fn: () => { D.envs = D.envs.includes(e.id) ? D.envs.filter(z => z !== e.id) : [...D.envs, e.id]; wzDraw(false); } })), 2, 'compact'),
          D.envs.length ? null : wzP('Cochez au moins un compte.', 'wz-muted wz-c')],
        onBack: () => stage('gwhen'),
        next: { label: (G.qi || 0) < total() - 1 ? 'Projet suivant' : 'Ajouter ce projet', fn: add, disabled: !D.envs.length }
      };
    }

    const rows = wzGoalRows(), effort = rows.reduce((t, r) => t + r.effort, 0);
    return {
      title: 'Vos projets',
      lead: rows.length ? null : 'Aucun projet pour l’instant.',
      body: [
        h('div', { class: 'wz-goals' }, ...rows.map(r => h('div', { class: 'wz-goal' },
          h('span', { class: 'wz-goal-ic' }, getIcon(WZ_GOAL_IC[r.g.type] || 'star', 18)),
          h('div', { class: 'wz-goal-m' },
            h('div', { class: 'wz-goal-h' }, h('strong', null, r.g.name), h('span', null, `${E0.format(r.g.target)} · ${fmtGoalDate(r.gd)}`)),
            h('div', { class: 'wz-goal-bar' }, h('i', { style: `width: ${Math.min(100, r.funded / r.g.target * 100)}%;` })),
            h('div', { class: 'wz-goal-f' }, r.rest > 0 ? `Encore ${E0.format(r.effort)} par mois` : 'Déjà financé ✓', h('span', null, `${P0.format(Math.min(1, r.funded / r.g.target))} financé`))),
          h('div', { class: 'wz-goal-a' },
            h('button', { class: 'wz-x', 'aria-label': `Modifier ${r.g.name}`, onclick: () => openGoalModal(r.g) }, getIcon('edit', 14)),
            h('button', { class: 'wz-x', 'aria-label': `Supprimer ${r.g.name}`, onclick: () => openConfirmModal({ title: `Supprimer « ${r.g.name} » ?`, message: 'Ce projet sera supprimé.', confirmText: 'Supprimer', confirmStyle: 'btn-danger', onConfirm: () => { S.goals = gl().filter(x => x !== r.g); wzSave(); } }) }, getIcon('trash', 14)))))),
        rows.length ? (effort > free + 0.5
          ? wzNote(`Vos projets demandent ${E0.format(effort)} par mois, plus que les ${E0.format(Math.max(0, free))} que vous pouvez épargner. Repoussez une date ou réduisez un montant.`, 'warn')
          : wzNote(`${E0.format(effort)} par mois suffisent. Il vous restera ${E0.format(free - effort)} de marge.`, 'ok')) : null,
        h('button', { class: 'wz-add', onclick: () => { G.d = null; G.sel = []; stage('type'); } }, getIcon('plus', 16), rows.length ? 'Ajouter un autre projet' : 'Ajouter un projet'),
        rows.length ? wzP('Votre épargne actuelle est répartie entre vos projets du plus proche au plus lointain, sans compter deux fois le même euro. Hors rendement futur.', 'wz-muted wz-small') : null
      ],
      next: { label: 'Étape suivante' }
    };
  },

  /* ===== 4 · Votre plan ===== */
  's-intro': () => {
    const free = wzCap(), effort = wzGoalRows().reduce((t, r) => t + r.effort, 0);
    return wzCover(3, 'Dernière étape : choisir ce que vous achetez chaque mois, et combien. Investir un peu, régulièrement, évite de chercher le « bon moment ».', [
      getBudget().rev > 0 ? wzBig('Vous pouvez épargner', `${E0.format(Math.max(0, free))} / mois`, 'up', effort > 0 ? `dont ${E0.format(effort)} pour vos projets` : null) : null
    ]);
  },

  's-plan': () => {
    const base = wzCapBase();
    const mEnvs = S.envs.filter(e => TYPES[e.type].m || TYPES[e.type].mx);
    const sEnvs = S.envs.filter(e => !TYPES[e.type].m).sort((a, b) => (TYPES[b.type].nc ? 1 : 0) - (TYPES[a.type].nc ? 1 : 0));
    const y0 = nowYear(), m0 = nowMonth();
    const hasPlan = [y0, y0 + 1].some(y => S.st && S.st[y] && (S.st[y].b.length || S.st[y].p.length));
    const P = WZ_DRAFT.plan = WZ_DRAFT.plan || { stage: hasPlan || !mEnvs.length ? 'list' : 'asset', y: y0 };
    const D = P.d = P.d || { name: '', sym: '', kind: 'ETF', env: (mEnvs[0] || {}).id, amt: null, start: 'now', next: true };
    const stage = s => { if (s === 'list' && WZ_SOLO) return closeWizard(); P.stage = s; wzDraw(true); };

    if (P.stage === 'asset') {
      const held = [];
      mEnvs.forEach(e => e.lines.filter(l => l.m).forEach(l => { if (!held.some(x => x.sym === l.sym)) held.push({ sym: l.sym, name: l.name, kind: l.kind || 'Action', env: e.id }); }));
      const pickA = o => { const q = M.q[o.sym]; Object.assign(D, { name: o.name, sym: o.sym, kind: o.kind, price: q && q.price != null ? q.price : null, cur: q ? q.currency : null }); if (o.env) D.env = o.env; stage('amount'); };
      return {
        title: 'Qu’achetez-vous chaque mois ?',
        body: [
          held.length ? h('div', { class: 'wz-label' }, 'Déjà chez vous') : null,
          held.length ? wzChoices(held.map(o => ({ ic: 'trending-up', t: o.name, d: o.kind, col: 'ch4', arrow: true, fn: () => pickA(o) }))) : null,
          h('button', { class: 'wz-new', onclick: () => { P.sq = ''; P.res = null; stage('nsearch'); } }, getIcon('plus', 18), 'Nouveau titre')
        ],
        onBack: hasPlan || WZ_SOLO ? () => stage('list') : null,
        skip: hasPlan || WZ_SOLO ? null : 'Je verrai plus tard',
        skipFn: () => stage('list'),
        next: hasPlan && !WZ_SOLO ? { label: 'Voir mon plan', fn: () => stage('list') } : { hidden: true }
      };
    }
    if (P.stage === 'nsearch') {
      const inp = h('input', { type: 'text', class: 'af-q', value: P.sq || '', placeholder: 'ex. Air Liquide', autocomplete: 'off', 'aria-label': 'Titre recherché' });
      const go = () => { if ((P.sq || '').trim().length < 2) { inp.focus(); return; } P.res = null; P.err = null; stage('npick'); planSearch(P); };
      inp.oninput = () => { P.sq = inp.value; };
      inp.onkeydown = ev => { if (ev.key === 'Enter') go(); };
      return { title: 'Quel titre voulez-vous acheter ?', lead: 'Son nom, son ISIN ou son code.', body: [inp], onBack: () => stage('asset'), next: { label: 'Rechercher', fn: go }, after: () => inp.focus() };
    }
    if (P.stage === 'npick') {
      const list = P.res;
      return {
        title: 'Lequel est le vôtre ?',
        lead: list && list.length ? 'Avec le cours actuel du marché.' : null,
        body: list == null ? [wzP('Recherche en cours…', 'wz-muted wz-c')]
          : [list.length ? wzChoices(list.map(x => ({ ic: x.type === 'Crypto' ? 'zap' : x.type === 'ETF' || x.type === 'Fonds' ? 'pie-chart' : 'trending-up', t: x.name,
              d: [x.type, x.exchange, x.price != null ? `${x.price.toLocaleString('fr-FR', { maximumFractionDigits: 2 })} ${x.currency || ''}`.trim() : 'cours indisponible'].filter(Boolean).join(' · '),
              col: 'ch4', arrow: true, fn: () => { Object.assign(D, { name: x.name, sym: x.symbol, kind: x.type || 'Action', price: x.price, cur: x.currency }); stage('amount'); } })))
            : wzNote(P.err || 'Aucun titre trouvé. Essayez le nom complet ou l’ISIN.', 'warn')],
        onBack: () => stage('nsearch'),
        next: { label: 'Modifier la recherche', fn: () => stage('nsearch') }
      };
    }

    if (P.stage === 'amount') {
      const err = h('div', { class: 'wz-err', role: 'alert' });
      const partsTxt = () => D.amt > 0 && D.price > 0 ? `≈ ${N.format(Math.round(D.amt / D.price * 100) / 100)} part(s) par mois au cours actuel` : 'Indiquez un montant pour voir l’équivalent en parts.';
      const starts = [['now', `Dès ${MONTH_NAMES[m0].toLowerCase()}`, y0, m0], ...(m0 < 11 ? [['next', `En ${MONTH_NAMES[m0 + 1].toLowerCase()}`, y0, m0 + 1]] : []), ['jan', `En janvier ${y0 + 1}`, y0 + 1, 0]];
      const add = () => {
        if (!(D.amt > 0)) { err.textContent = 'Indiquez un montant par mois.'; return; }
        if (!D.env) { err.textContent = 'Choisissez le compte.'; return; }
        const nm = (D.name || '').trim() || (D.sym || '').trim(), sym = (D.sym || '').trim().toUpperCase() || nm;
        const [, , ys, ms] = starts.find(s => s[0] === D.start) || starts[0];
        const push = (y, from) => { const T = getStrategy(y); for (let m = from; m <= 11; m++) T.b.push({ id: uid(), m, sym, name: nm, env: D.env, amt: D.amt, done: null, kind: D.kind || undefined }); };
        push(ys, ms);
        if (ys === y0 && D.next) push(y0 + 1, 0);
        P.d = null; if (WZ_SOLO) { closeWizard(); toast('Ajouté à votre plan'); return; }
        P.stage = 'list'; P.y = ys; wzSave(); wzDraw(true);
      };
      return {
        kicker: D.name + (D.price != null ? ` · cours actuel ${D.price.toLocaleString('fr-FR', { maximumFractionDigits: 2 })} ${D.cur === 'EUR' || !D.cur ? '€' : D.cur}` : ''),
        title: 'Combien chaque mois ?',
        body: [
          wzAmount(D.amt, n => { D.amt = n; const pe = document.getElementById('wz-parts'); if (pe) pe.textContent = partsTxt(); }, { label: 'Montant mensuel en euros' }),
          D.price > 0 && (D.cur === 'EUR' || !D.cur) ? h('p', { id: 'wz-parts', class: 'wz-p wz-muted wz-c' }, partsTxt()) : null,
          base > 0 ? wzP(`Vous pouvez épargner environ ${E0.format(Math.max(0, wzCap()))} par mois.`, 'wz-muted wz-c') : null,
          mEnvs.length > 1 ? h('div', { class: 'wz-q' }, h('div', { class: 'wz-q-t' }, 'Sur quel compte ?'), wzChips(mEnvs.map(e => [e.name, D.env === e.id, () => { D.env = e.id; wzDraw(false); }]))) : null,
          h('div', { class: 'wz-q' }, h('div', { class: 'wz-q-t' }, 'À partir de quand ?'), wzChips(starts.map(([k, t]) => [t, D.start === k, () => { D.start = k; wzDraw(false); }]))),
          D.start !== 'jan' ? h('label', { class: 'wz-check' }, h('input', { type: 'checkbox', checked: D.next ? true : null, onchange: ev => { D.next = ev.target.checked; } }), `Continuer aussi toute l’année ${y0 + 1}`) : null,
          err
        ],
        onBack: () => stage('asset'),
        next: { label: 'Ajouter à mon plan', fn: add }
      };
    }

    if (P.stage === 'prov') {
      const Q = P.q = P.q || { name: 'Épargne de précaution', amt: null, env: (sEnvs[0] || {}).id };
      const err = h('div', { class: 'wz-err', role: 'alert' });
      return {
        title: 'Mettre de côté chaque mois',
        lead: 'Sur un livret, pour une dépense future ou un coussin de sécurité.',
        body: [
          wzChips(['Épargne de précaution', 'Vacances', 'Impôts', 'Travaux'].map(t => [t, Q.name === t, () => { Q.name = t; wzDraw(false); }])),
          wzAmount(Q.amt, n => { Q.amt = n; }, { label: 'Montant mensuel en euros' }),
          sEnvs.length > 1 ? h('div', { class: 'wz-q' }, h('div', { class: 'wz-q-t' }, 'Sur quel compte ?'), wzChips(sEnvs.map(e => [e.name, Q.env === e.id, () => { Q.env = e.id; wzDraw(false); }]))) : null,
          err
        ],
        onBack: () => stage('list'),
        next: { label: 'Programmer', fn: () => {
          if (!(Q.amt > 0)) { err.textContent = 'Indiquez un montant par mois.'; return; }
          getStrategy(y0).p.push({ id: uid(), name: Q.name, amt: Q.amt, env: Q.env, f: m0 });
          P.q = null; if (WZ_SOLO) { closeWizard(); toast('Ajouté à votre plan'); return; }
          P.stage = 'list'; P.y = y0; wzSave(); wzDraw(true);
        } }
      };
    }

    // Vue d'ensemble : calendrier de l'année + lignes du plan
    const y = P.y, T = getStrategy(y), firstM = y === y0 ? m0 : 0;
    const monthTot = m => T.b.filter(b => b.m === m).reduce((t, b) => t + (b.done && b.done.e != null ? b.done.e : b.amt), 0) + T.p.filter(p => m >= (p.f || 0)).reduce((t, p) => t + p.amt, 0);
    const tots = MONTH_NAMES.map((_, m) => monthTot(m));
    const maxT = Math.max(base, ...tots, 1);
    const over = tots.map((t, m) => m >= firstM && base > 0 && t > base + 0.5);
    const series = {};
    T.b.filter(b => !b.done).forEach(b => { const k = [b.name, b.env, b.amt].join('|'); (series[k] = series[k] || []).push(b); });
    const serList = Object.values(series);
    const envName = id => (S.envs.find(e => e.id === id) || { name: '?' }).name;
    const avg = (() => { const ms = tots.slice(firstM); return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0; })();
    return {
      title: 'Votre plan mensuel',
      body: [
        wzChips([y0, y0 + 1].map(v => [String(v), v === y, () => { P.y = v; wzDraw(false); }])),
        h('div', { class: 'wz-cal', role: 'list', 'aria-label': `Calendrier ${y}` }, ...MONTH_NAMES.map((mn, m) => h('div', { class: 'wz-cal-m' + (m < firstM ? ' past' : '') + (over[m] ? ' over' : ''), role: 'listitem', 'aria-label': `${mn} : ${E0.format(tots[m])}` },
          h('div', { class: 'wz-cal-b' }, h('i', { style: `height: ${Math.max(tots[m] ? 6 : 0, Math.round(tots[m] / maxT * 100))}%;` }), base > 0 ? h('u', { style: `bottom: ${Math.round(base / maxT * 100)}%;` }) : null),
          h('div', { class: 'wz-cal-n' }, mn.slice(0, 1))))),
        avg > 0 ? (over.some(Boolean)
          ? wzNote(`${over.filter(Boolean).length} mois dépassent ce que vous pouvez épargner (${E0.format(base)}). Réduisez un montant ou étalez vos achats.`, 'warn')
          : wzNote(`≈ ${E0.format(avg)} par mois, dans vos moyens${base > 0 ? ` (${E0.format(base)} disponibles)` : ''}.`, 'ok')) : wzP('Rien de prévu pour cette année.', 'wz-muted wz-c'),
        serList.length || T.p.length ? h('div', { class: 'wz-lines' },
          ...serList.map(bs => {
            const b = bs[0], ms = bs.map(x => x.m).sort((p, q) => p - q);
            return h('div', { class: 'wz-line' },
              h('span', { class: 'wz-line-ic' }, b.kind === 'Crypto' ? 'CRY' : b.kind === 'Action' ? 'ACT' : b.kind === 'Fonds' ? 'FDS' : 'ETF'),
              h('span', { class: 'wz-line-tx' }, h('span', { class: 'wz-line-t' }, b.name), h('span', { class: 'wz-line-s' }, `${envName(b.env)} · ${ms.length > 1 ? `${MONTH_NAMES[ms[0]].toLowerCase()} → ${MONTH_NAMES[ms[ms.length - 1]].toLowerCase()}` : MONTH_NAMES[ms[0]]}`)),
              h('span', { class: 'wz-line-v' }, `${E0.format(b.amt)}/mois`),
              h('button', { class: 'wz-x', 'aria-label': `Retirer ${b.name} du plan`, onclick: () => { T.b = T.b.filter(x => !bs.includes(x)); wzSave(); wzDraw(false); } }, getIcon('x', 14)));
          }),
          ...T.p.map(p => h('div', { class: 'wz-line' },
            h('span', { class: 'wz-line-ic' }, getIcon('lock', 15)),
            h('span', { class: 'wz-line-tx' }, h('span', { class: 'wz-line-t' }, p.name), h('span', { class: 'wz-line-s' }, `${envName(p.env)} · mise de côté`)),
            h('span', { class: 'wz-line-v' }, `${E0.format(p.amt)}/mois`),
            h('button', { class: 'wz-x', 'aria-label': `Retirer ${p.name}`, onclick: () => { T.p = T.p.filter(x => x !== p); wzSave(); wzDraw(false); } }, getIcon('x', 14))))) : null,
        mEnvs.length ? h('button', { class: 'wz-add', onclick: () => { P.d = null; stage('asset'); } }, getIcon('plus', 16), 'Ajouter un achat mensuel')
          : wzNote('Pour programmer des achats, ajoutez un PEA, un compte-titres ou une assurance vie à l’étape 1.'),
        sEnvs.length ? wzLink('Mettre aussi de côté sur un livret', () => stage('prov'), 'lock') : null
      ],
      next: { label: 'Terminer' }
    };
  },

  end: () => {
    const free = wzCap(), rows = wzGoalRows();
    const loanInt = wzLoanItems().map(x => loanCalc(x.L)).filter(c => !c.partial).reduce((t, c) => t + Math.max(0, c.pmt * c.left - c.crd + c.ins * c.left), 0);
    const sumRow = (i, c, ic, k, n, suf, sub, txt) => h('div', { class: 'wz-sum-r', style: `--i: ${i}; --cc: var(--${c}); --cl: var(--${c}-l);` },
      h('span', { class: 'wz-sum-ic' }, getIcon(ic, 17)),
      h('span', { class: 'wz-sum-k' }, h('span', null, k), sub ? h('em', null, sub) : null),
      h('strong', n != null ? { 'data-count': n, 'data-suffix': suf } : null, txt != null ? txt : E0.format(n) + suf));
    // Projection indicative : patrimoine actuel + plan mensuel prévu, 4 % par an pendant 20 ans
    const T0 = (S.st || {})[nowYear() + 1] || (S.st || {})[nowYear()];
    const pmt = T0 ? (T0.b.reduce((t, b) => t + (b.done ? 0 : b.amt), 0) + T0.p.reduce((t, p) => t + p.amt * (12 - (p.f || 0)), 0)) / 12 : 0;
    const i4 = 0.04 / 12, fv20 = Math.max(0, netWorthNow()) * Math.pow(1 + i4, 240) + (pmt > 0 ? pmt * (Math.pow(1 + i4, 240) - 1) / i4 : 0);
    return {
      center: true, back: false,
      art: wzStartArt(fv20 > 0 ? fv20 : null),
      title: 'Votre boule de neige est prête.',
      after: () => {
        const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!WZ_DRAFT.endFx) { WZ_DRAFT.endFx = 1; if (!reduce) setTimeout(confetti, 250); }
        if (reduce) return;
        document.querySelectorAll('#wz-root [data-count]').forEach(el => {
          const to = +el.dataset.count, suf = el.dataset.suffix || '', t0 = performance.now(), D = 1100;
          const step = now => { const k = Math.min(1, (now - t0) / D), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = E0.format(v) + suf; if (k < 1 && el.isConnected) requestAnimationFrame(step); };
          requestAnimationFrame(step);
        });
      },
      lead: 'Tout est en place : il n’y a plus qu’à la laisser rouler.',
      body: [
        h('div', { class: 'wz-sum anim' },
          sumRow(0, 'ch1', 'wallet', 'Ce que vous avez', netWorthNow(), '', null),
          sumRow(1, 'ch2', 'percent', 'Ce que ça vous coûte', sums(S.envs).f, ' / an', loanInt > 0 ? `+ ${E0.format(loanInt)} d’intérêts de crédit` : 'frais de gestion estimés'),
          sumRow(2, 'ch3', 'target', 'Projets de vie', null, '', rows.length ? `≈ ${E0.format(rows.reduce((t, r) => t + r.effort, 0))} / mois pour les financer` : 'aucun pour l’instant', rows.length ? String(rows.length) : '—'),
          sumRow(3, 'ch4', 'trending-up', 'Épargne possible', free, ' / mois', null)),
      ],
      next: { label: 'Découvrir mon tableau de bord', fn: () => { closeWizard(true); confetti(); go('#/'); } }
    };
  }
};

/* ==================== AJOUT D'UN TITRE COTÉ, PAS À PAS (une information par écran) ====================
   Utilisé par le parcours d'accueil et par le bouton « Ajouter » pour les comptes cotés (PEA, CTO, cryptos).
   Le titre est toujours rattaché à une cotation réelle : pas de valeur approximative. */
let AF = null;
const afEnvs = () => S.envs.filter(e => TYPES[e.type] && TYPES[e.type].m);
function openAssetFlow(env, onClose, opts) {
  const o = opts || {};
  const e = env && (TYPES[env.type].m || TYPES[env.type].mx) ? env : afEnvs()[0];
  if (!e) { openAlertModal('Compte requis', 'Ajoutez d’abord un PEA, un compte-titres ou un compte crypto.'); return; }
  const mode = o.mode || (TYPES[e.type].m ? 'quoted' : null);
  const pickEnv = !!o.pickEnv && S.envs.length > 1;
  const fixedMode = !!o.mode;
  AF = { env: e.id, mode, noFee: !!o.noFee, fixedMode, thenManual: !!o.thenManual, step: pickEnv ? 'env' : mode === 'manual' ? 'mname' : mode === 'quoted' ? 'search' : 'kind', q: '', res: null, pick: null, qty: null, pru: null, fee: undefined, added: null, mn: '', mv: null, mp: null, onClose };
  let root = document.getElementById('af-root');
  if (!root) { root = h('div', { id: 'af-root', class: 'wz af', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'af-h' }); document.body.append(root); }
  document.body.classList.add('wz-lock');
  afDraw(true);
}
function closeAssetFlow() {
  const cb = AF && AF.onClose;
  AF = null;
  const root = document.getElementById('af-root');
  if (root) root.remove();
  if (cb) cb();
  if (!WZ_OPEN) { document.body.classList.remove('wz-lock'); render(); } else wzDraw(true);
}
const afEnv = () => S.envs.find(x => x.id === AF.env);
const afGo = st => { AF.step = st; afDraw(true); };
const afManualOnly = () => AF && AF.mode === 'manual' && AF.fixedMode;
const afIsFund = () => AF.pick && ['ETF', 'Fonds'].includes(AF.pick.type);

async function afSearch() {
  const q = AF.q.trim(), qi = q.toUpperCase().replace(/\s/g, ''), crypto = afEnv().type === 'crypto';
  AF.res = null; AF.err = null; afGo('pick');
  const out = [];
  try {
    if (!crypto && ISIN_RE.test(qi)) {
      if (!isinOk(qi)) { AF.err = 'Cet ISIN n’est pas valide : vérifiez chaque caractère.'; }
      else if (!S.url) { AF.err = 'Les cours en direct ne sont pas activés (Réglages) : impossible de chercher cet ISIN.'; }
      else {
        const j = await api({ action: 'isin', isin: qi });
        (j.listings || []).forEach(raw => { const r = norm({ ...raw, prev: raw.price }); out.push({ symbol: raw.symbol, name: raw.name, exchange: raw.exchange, type: raw.type, currency: r.currency, price: r.price, isin: qi }); });
      }
    } else {
      const ql = q.toLowerCase().replace(/[\s-]+/g, '');
      if (!crypto) ETF_CAT.filter(r => (r.name + r.symbol + r.isin + r.kw).toLowerCase().replace(/[\s-]+/g, '').includes(ql)).forEach(r => out.push({ symbol: r.symbol, name: r.name, exchange: r.exchange, type: r.type, isin: r.isin }));
      if (S.url) {
        const j = await api({ action: 'search', q });
        (j.results || []).filter(r => (crypto ? r.type === 'Crypto' : r.type !== 'Crypto') && !out.some(z => z.symbol === r.symbol)).forEach(r => out.push({ symbol: r.symbol, name: r.name, exchange: r.exchange, type: r.type }));
      } else if (!out.length) AF.err = 'Les cours en direct ne sont pas activés (Réglages) : seule la liste des ETF connus est disponible.';
    }
  } catch (err) { AF.err = 'La recherche n’a pas abouti (connexion). Réessayez dans un instant.'; }
  if (!AF) return;
  AF.res = out;
  if (AF.step === 'pick') afDraw(false);
}

function afAdd() {
  const e = afEnv(), r = AF.pick;
  const l = { id: uid(), m: 1, sym: r.symbol, name: r.name, qty: AF.qty, cost: AF.pru, divs: [], kind: r.type || 'Action', ordFee: 0 };
  if (r.isin) l.isin = r.isin;
  if (afIsFund() && AF.fee != null) l.fee = AF.fee;
  e.lines.push(l);
  save();
  AF.added = l;
  if (S.url) refreshQuotes().then(() => { if (AF && AF.step === 'done') afDraw(false); });
}

          c.children[0].classList.add('gain'); c.children[1].classList.add('loss'); return c; })(),

        wzP(AF.pvs === 'loss' ? 'Une perte : le fonds vaut moins que ce que vous avez versé.' : 'Un gain : le fonds vaut plus que ce que vous avez versé.', 'wz-c wz-small ' + (AF.pvs === 'loss' ? 'loss' : 'gain'))],

    V.center = true;

  } else if (AF.step === 'search') {
    const inp = h('input', { type: 'text', class: 'af-q', value: AF.q, placeholder: crypto ? 'ex. Bitcoin' : 'ex. LU1681043599', autocomplete: 'off', autocapitalize: crypto ? 'off' : 'characters', 'aria-label': 'Titre recherché' });
    inp.oninput = () => { AF.q = inp.value; cta.disabled = AF.q.trim().length < 2; };
    inp.onkeydown = ev => { if (ev.key === 'Enter' && AF.q.trim().length >= 2) afSearch(); };
    const ms = afEnvs();
    V = {

      ],

        : [list.length ? wzChoices(list.map(x => ({ ic: x.type === 'Crypto' ? 'zap' : x.type === 'ETF' || x.type === 'Fonds' ? 'pie-chart' : 'trending-up', t: x.name,
            d: [x.type, x.symbol, x.exchange, x.currency, x.price != null ? `cours ${x.price.toLocaleString('fr-FR', { maximumFractionDigits: 2 })}` : null].filter(Boolean).join(' · '),
            col: 'ch1', arrow: true, fn: () => { AF.pick = x; afGo('qty'); } })))

      onBack: () => afGo('pick'),
      next: { label: 'Continuer', fn: () => { if (!(AF.qty > 0)) { err.textContent = 'Indiquez une quantité (ex. 12 ou 0,5).'; return; } afGo('pru'); } }
    };

        if (!(AF.pru >= 0) || AF.pru == null) { err.textContent = 'Indiquez le prix moyen payé par part.'; return; }

    V = {

    };
  } else {
    const l = AF.added, x = l ? val(l) : null;
    V = {
      center: true, back: false,
      art: h('div', { class: 'wz-art', style: '--cc: var(--up); --cl: var(--up-light);' }, getIcon('check', 28)),

    };
  }

  const top = h('header', { class: 'wz-top' }, h('div', { class: 'wz-top-in' },
    V.onBack || ['search', 'kind', 'mname', 'env'].includes(AF.step) ? h('button', { class: 'wz-ico', 'aria-label': 'Retour', onclick: () => (V.onBack ? V.onBack() : closeAssetFlow()) }, getIcon('chevron-left', 20)) : h('span', { class: 'wz-ico-sp' }),
    h('div', { class: 'wz-top-mid' }, h('div', { class: 'wz-top-t' }, AF.step === 'env' ? 'Ajouter un titre' : afTag || `Ajouter à ${e.name}`)),
    h('button', { class: 'wz-later', onclick: closeAssetFlow }, 'Fermer')));
  const card = h('section', { class: 'wz-card' + (V.center ? ' wz-center' : '') },
    V.art || null, V.kicker ? h('div', { class: 'wz-kicker' }, V.kicker) : null,
    h('h1', { id: 'af-h', class: 'wz-title', tabindex: '-1' }, wzNb(V.title)),
    V.lead ? h('p', { class: 'wz-lead' }, wzNb(V.lead)) : null, ...(V.body || []).filter(Boolean));
  const nx = V.next || {};
  const cta = h('button', { class: 'wz-cta', disabled: nx.disabled ? true : null, onclick: () => (nx.fn ? nx.fn() : null) }, nx.label || 'Continuer');
  const foot = h('footer', { class: 'wz-foot' }, h('div', { class: 'wz-foot-in' }, cta, V.skipFn ? h('button', { class: 'wz-skip', onclick: V.skipFn }, V.skipLabel || 'Passer') : null));
  const main = h('main', { class: 'wz-main' }, card);
  root.replaceChildren(top, main, foot);
  if (nav) { const t = document.getElementById('af-h'); if (t) t.focus({ preventScroll: true }); }
  if (V.after) V.after();
}

/* ==================== INTERFACE (maquette v4) ====================
   Niveau 1 : l'essentiel de chaque onglet, lisible en un coup d'œil.
   Niveau 2 : « En savoir plus » ouvre une feuille avec d'autres graphiques.
   Niveau 3 : « Tout le détail » mène aux écrans complets (inchangés). */

const MONTHS_S = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
const MONTHS_L = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const KCOL = { 'Bourse': 'var(--c0)', 'Crypto': 'var(--c1)', 'Épargne': 'var(--c2)', 'Immobilier': 'var(--c3)', 'Autres': 'var(--c4)' };
const escH = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nE = v => E0.format(Math.round(v));
const sE = v => (v >= 0 ? '+ ' : '− ') + E0.format(Math.abs(Math.round(v)));

  } catch(err) {
    console.error(err);
    $('#app').replaceChildren(
      h('div', { class: 'card', style: 'padding: 24px; text-align: center;' },
        h('div', { style: 'font-weight: 700; color: var(--down);' }, 'Erreur d’affichage'),
        h('p', { style: 'font-size: 13px; color: var(--muted); margin: 6px 0 16px;' }, String(err && err.message || err)),
        h('button', { class: 'btn btn-primary btn-sm', onclick: () => go('#/') }, 'Retour à l’accueil')
      )
    );
  }

  updateNav(k);
  updateRelayStatusBadge();
}

function updateNav(k) {
  const activeIdx = ['', 'b'].includes(k) ? 0 : ['n', 'u'].includes(k) ? 2 : k === 'g' ? 3 : k === 's' ? 4 : 1;
  
  const pendingBuysCount = (S.st && S.st[nowYear()] ? S.st[nowYear()].b.filter(b => isDueBuy(b, nowYear())).length : 0) + pendProv(nowYear()).length;

  const items = [
    { label: 'Accueil', icon: 'home', href: '#/', badge: pendingBuysCount, cc: 'var(--ink)' },
    { label: 'Mon argent', icon: 'wallet', href: '#/a', cc: 'var(--ch1)' },
    { label: 'Mes coûts', icon: 'percent', href: '#/n', cc: 'var(--ch2)' },
    { label: 'Mes projets', icon: 'target', href: '#/g', cc: 'var(--ch3)' },
    { label: 'Mon plan', icon: 'trending-up', href: '#/s', cc: 'var(--ch4)' }
  ];

  $('#nav-container').replaceChildren(
    ...items.map((item, idx) => {
      const link = h('a', {
        href: item.href,
        class: 'nav-link',
        style: `--cc: ${item.cc};`,
        'aria-current': idx === activeIdx ? 'page' : null
      },
        getIcon(item.icon, 20),
        h('span', null, item.label)
      );
      if (item.badge > 0) {
        link.append(h('span', { class: 'nav-badge' }, String(item.badge)));
      }
      return link;
    })
  );
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

// Démarrage initial
window.addEventListener('load', () => {
  render();
  if (S.wz && S.wz.open) openWizard();
  if (S.url) refreshQuotes();
  if (relayIsDefault() && !(S.relayV >= RELAY_VERSION)) relayPingSilent();
});

setInterval(() => {
  if (S.url && !document.hidden) refreshQuotes();
}, 5 * 60 * 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.url && (!M.t || Date.now() - M.t > 5 * 60 * 1000)) {
    refreshQuotes();
  }
});
</script>
</body>
</html>
